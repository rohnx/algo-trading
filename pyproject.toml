[project]
name = "algo-trading"
version = "0.1.0"
description = "Live opening-range breakout monitor for Indian markets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "norenrestapioauth>=0.0.41",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[project.scripts]
orb = "orb.orb_monitor:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orb"
module-root = ""
source-exclude = ["/orb/tests", "/orb/research", "/orb/data", ".env", ".env.*"]
